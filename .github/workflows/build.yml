name: Build Termux Web APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract any ZIP file
        id: zip
        run: |
          echo "Searching for ZIP files in the repository..."
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in the repository!"
            echo "Please upload a .zip file that contains the Android project (with settings.gradle / build.gradle)."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT

          # Create extraction directory
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 3 -type f | head -30

          # Try to find the real project root (where settings.gradle lives)
          PROJECT_ROOT=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_ROOT" ]; then
            # Fallback: maybe the zip root itself is the project
            if [ -f "extracted/settings.gradle" ] || [ -f "extracted/settings.gradle.kts" ]; then
              PROJECT_ROOT="extracted"
            else
              echo "::error::No settings.gradle or settings.gradle.kts found after extracting the ZIP."
              echo "The ZIP must contain a valid Android project."
              exit 1
            fi
          fi

          echo "Project root detected: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> $GITHUB_OUTPUT

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using your release keystore."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. Building with the debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "${{ steps.zip.outputs.project_root }}"

          # Generate Gradle Wrapper if missing
          if [ ! -f gradlew ]; then
            echo "gradlew not found – generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name and verify the APK
        run: |
          mkdir -p dist

          # Find the generated APK
          APK_PATH=\( (find " \){{ steps.zip.outputs.project_root }}" -path "*/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK found after build!"
            find "${{ steps.zip.outputs.project_root }}" -name "*.apk" || true
            exit 1
          fi

          cp "\( APK_PATH" "dist/TermuxWeb-build \){{ github.run_number }}.apk"

          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs dist/*.apk | head -3 || true
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TermuxWeb-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
        
