name: Build Termux Web APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and extract any ZIP file
        id: zip
        run: |
          set -e
          echo "Searching for ZIP files..."
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in the repository"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted contents:"
          find extracted -maxdepth 3 | head -40

          # Find project root
          PROJECT_ROOT=""
          if [ -f extracted/settings.gradle ] || [ -f extracted/settings.gradle.kts ]; then
            PROJECT_ROOT="extracted"
          else
            PROJECT_ROOT=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname || true)
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found after extraction"
            exit 1
          fi

          echo "Project root: $PROJECT_ROOT"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using your release keystore."
          else
            echo "::warning::No KEYSTORE_BASE64 secret. Building with debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          cd "${{ steps.zip.outputs.project_root }}"

          if [ ! -f gradlew ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.7
          fi

          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name and verify the APK
        run: |
          set -e
          mkdir -p dist

          PROJECT_ROOT="${{ steps.zip.outputs.project_root }}"
          echo "Looking for APK under: $PROJECT_ROOT"

          # Safer way to find the APK
          APK_PATH=$(find "$PROJECT_ROOT" -type f -name "*.apk" | grep "/release/" | head -n 1 || true)

          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK found"
            echo "All APK files found:"
            find "$PROJECT_ROOT" -type f -name "*.apk" || true
            exit 1
          fi

          echo "Found APK: $APK_PATH"

          DEST="dist/TermuxWeb-build${{ github.run_number }}.apk"
          cp "$APK_PATH" "$DEST"
          echo "Copied to $DEST"

          # Optional signature check
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$BUILD_TOOLS" ] && [ -x "$BUILD_TOOLS/apksigner" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$DEST" | head -5 || true
          fi

          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TermuxWeb-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
